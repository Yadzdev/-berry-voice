name: Build BerryVoice Network
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate Berry Voice web client
        run: node --check app.js
      - name: Build Velocity and Paper plugins
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Upload plugins and website
        uses: actions/upload-artifact@v4
        with:
          name: BerryVoice-2.1.1
          if-no-files-found: error
          path: |
            paper-plugin/target/berryvoice-paper-2.1.1.jar
            velocity-plugin/target/berryvoice-velocity-2.1.1.jar
            index.html
            app.js
            config.js
            styles.css
            assets/**
            CNAME
            .nojekyll
            deploy/**
